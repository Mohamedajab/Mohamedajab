<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed A. Ali — Software engineering</title>
  <desc id="desc">Backend systems, web applications and open source. A small diagram shows a request being validated and committed, with a retry path.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f2f0e9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="12" fill="#14202b"/>
  <rect width="1200" height="320" rx="12" fill="url(#grid)"/>
  <path d="M48 48H110" stroke="#c5f277" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="88" font-size="16" letter-spacing="3" fill="#c5f277">SOFTWARE ENGINEERING</text>
    <text x="45" y="163" font-size="64" font-weight="700" letter-spacing="-2" fill="#f5f2e9">Mohamed A. Ali</text>
    <text x="48" y="207" font-size="23" fill="#c0cbd3">Backend systems. Web applications. Open source.</text>
    <text x="48" y="271" font-size="15" letter-spacing="1.5" fill="#8fa5b6">PYTHON / TYPESCRIPT / JAVA / SQL</text>
  </g>
  <path d="M800 48V272" stroke="#3b4b57"/>
  <g font-family="Consolas, monospace" font-size="18" fill="#e7ecef">
    <rect x="850" y="56" width="280" height="49" rx="6" fill="#20323f" stroke="#496170"/>
    <text x="874" y="87">01  request</text>
    <rect x="850" y="135" width="280" height="49" rx="6" fill="#20323f" stroke="#496170"/>
    <text x="874" y="166">02  validate</text>
    <rect x="850" y="214" width="280" height="49" rx="6" fill="#263a32" stroke="#c5f277"/>
    <text x="874" y="245" fill="#c5f277">03  commit</text>
  </g>
  <g stroke="#91a8b8" stroke-width="2" fill="none">
    <path d="M990 105V133m-5-6 5 6 5-6M990 184V212m-5-6 5 6 5-6"/>
    <path d="M1130 239h27V80h-25m6-5-6 5 6 5" stroke-dasharray="4 5"/>
  </g>
  <text x="1175" y="178" transform="rotate(-90 1175 178)" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#91a8b8">RETRY</text>
</svg>
